interface:
  display_name: "iysl-equity-council"
  short_description: "Run three isolated pre-model assumption challengers."
  default_prompt: "Use $iysl-equity-council to run the named Aswath Damodaran, George Soros, and Michael Mauboussin public-method agents against an accepted PEI preliminary underwrite. Hash the underwrite first and give each agent only its blind packet, never the owner values. Each agent estimates its own Base and range for every candidate assumption, or marks it not estimable with the obtainable missing evidence, checking whether related inputs reflect one common operating driver or an unsupported repeated risk discount; reasonable multi-input linkage is allowed. Independently search relevant original sources under the project browser/Exa policy; new discoveries stay candidates until Equity Data admits them. Each agent states its strongest upside and downside cases; the Soros agent also argues the most plausible repricing path and the cost of a missed entry. Return sealed memos to the same PEI owner, who adjudicates with the validator's range comparisons before model commit."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
