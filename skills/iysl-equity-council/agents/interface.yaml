interface:
  display_name: "iysl-equity-council"
  short_description: "Run three isolated pre-model assumption challengers."
  default_prompt: "Use $iysl-equity-council to run the named Aswath Damodaran, George Soros, and Michael Mauboussin public-method agents against an accepted PEI preliminary underwrite. Each agent must test what is too conservative, too aggressive, or uncertain, including whether related inputs reflect one common operating driver or an unsupported repeated risk discount; reasonable multi-input linkage is allowed. Independently search relevant original sources under the project browser/Exa policy; new discoveries stay candidates until Equity Data admits them. State the strongest evidence-consistent market-right countercase, then return sealed challenges to the same PEI owner for adjudication before model commit."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
