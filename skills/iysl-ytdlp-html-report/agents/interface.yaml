interface:
  display_name: "iysl-ytdlp-html-report"
  short_description: "Transcript-grounded video reading and optional formal reports."
  default_prompt: "Use $iysl-ytdlp-html-report to read this public video from its transcript; answer inline unless I request a formal report."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
