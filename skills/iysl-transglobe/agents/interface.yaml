interface:
  display_name: "iysl-transglobe"
  short_description: "Select and render TransGlobe charts; restyle Office and HTML."
  default_prompt: "Use $iysl-transglobe 依報告情境與資料自動選出最適合的全球藍圖表，產生 SVG 或套用到文件，保留數據與原意。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
