interface:
  display_name: "Equity Data"
  short_description: "Verified filings, provider data, and public research"
  default_prompt: "Use $equity-data with @public-equity-investing to prepare a source-backed initiation pack from filings, my supplied provider snapshot, and public web research."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
