interface:
  display_name: "Equity Data"
  short_description: "Default evidence collection for public-equity analysis"
  default_prompt: "Pair $equity-data with @public-equity-investing by default; collect filings, market data, public sources, and Seeking Alpha Chat evidence before investor analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
