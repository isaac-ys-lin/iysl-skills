interface:
  display_name: "Equity Data"
  short_description: "Completeness-first formal equity evidence intake"
  default_prompt: "Pair $equity-data with the Public Equity Investing router; for formal initiation or research refresh run Ask SA recall, disposition all twelve Seeking Alpha groups in a validated coverage artifact, resume Wall Street targets after independent fair value freezes, verify load-bearing claims, and keep the owner handoff lean. Keep non-formal workflows bounded."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
