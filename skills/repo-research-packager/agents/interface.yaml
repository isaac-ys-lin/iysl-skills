interface:
  display_name: "Repo Research Packager"
  short_description: "Curate any repository into an AI-ready research pack"
  default_prompt: "Use $repo-research-packager to package this repository into a focused Taiwan Traditional Chinese Markdown research handoff for another AI."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
