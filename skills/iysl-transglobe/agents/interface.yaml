interface:
  display_name: "iysl-transglobe"
  short_description: "Turn a script into a TransGlobe PowerPoint deck or HTML report; restyle files and charts."
  default_prompt: "Use $iysl-transglobe 把這份文字稿做成全球藍簡報：先寫每頁一句判斷的故事線，每頁配一個主視覺，圖表用可編輯的原生圖表，保留所有數字與出處。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
