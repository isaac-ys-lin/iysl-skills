interface:
  display_name: "iysl-ytdlp-html-report"
  short_description: "Transcript-complete Traditional Chinese video report with verified routing."
  default_prompt: "Use $iysl-ytdlp-html-report for one public video: produce a transcript-complete v2.4 Traditional Chinese Markdown/HTML report, reader-safe source limitation, and separate verification sidecar."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
