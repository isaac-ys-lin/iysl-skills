interface:
  display_name: "Equity Data"
  short_description: "Bounded evidence intake for public-equity analysis"
  default_prompt: "Pair $equity-data with @public-equity-investing; run one bounded Seeking Alpha or Ask SA scan, target relevant structured data, and verify material claims before investor analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
