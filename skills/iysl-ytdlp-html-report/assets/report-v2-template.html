<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}｜影片閱讀摘要</title>
  <style>
    :root { color-scheme: light; --ink:#192126; --muted:#657078; --paper:#fbfaf6; --card:#fff; --line:#d8d9d5; --accent:#086f68; --warm:#a3452e; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; line-height:1.65; overflow-wrap:anywhere; }
    a { color:var(--accent); text-underline-offset:3px; }
    .page { width:min(1080px,calc(100% - 32px)); margin-inline:auto; }
    .hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,.8fr); gap:32px; align-items:center; padding:48px 0 34px; }
    .eyebrow { color:var(--warm); font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:.25rem 0 0; font-family:ui-serif,Georgia,"Noto Serif TC",serif; font-size:clamp(2rem,5vw,3.8rem); line-height:1.08; }
    .subtitle { color:#37454d; font-size:1.08rem; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; color:var(--muted); font-size:.88rem; }
    .meta span:not(:empty) { border:1px solid var(--line); border-radius:999px; padding:5px 10px; }
    .media-anchor { display:block; overflow:hidden; border-radius:12px; background:#20272b; box-shadow:0 16px 40px #19212622; }
    .media-anchor img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
    main { padding:28px 0 68px; }
    .report-block { margin:0 0 30px; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:24px; }
    .report-block > header { border-bottom:1px solid var(--line); padding-bottom:14px; }
    h2 { margin:0; font-size:clamp(1.4rem,3vw,2rem); line-height:1.2; }
    .summary { color:#37454d; }
    .process { list-style:none; margin:20px 0 0; padding:0; counter-reset:step; display:flex; gap:34px; }
    .process li { counter-increment:step; position:relative; flex:1 1 0; min-width:0; border:1px solid #bad4d1; border-radius:10px; padding:44px 14px 14px; background:linear-gradient(145deg,#fff,#f0f8f7); }
    .process li::before { content:counter(step); position:absolute; top:12px; left:14px; display:grid; place-items:center; width:26px; height:26px; border-radius:50%; color:#fff; background:var(--accent); font-size:.84rem; font-weight:800; }
    .process li:not(:last-child)::after { content:"→"; position:absolute; right:-27px; top:50%; transform:translateY(-50%); color:var(--accent); font-size:1.35rem; font-weight:900; }
    .process p,.actions p { margin:.2rem 0; color:#45535b; }
    .table-wrap { overflow-x:auto; margin-top:18px; }
    table { width:100%; min-width:620px; border-collapse:collapse; }
    th,td { border-bottom:1px solid var(--line); padding:10px; text-align:left; vertical-align:top; }
    th { color:#435159; background:#f2f2ee; font-size:.86rem; }
    .actions { display:grid; gap:12px; padding-left:1.2rem; }
    .key-points { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-top:18px; }
    .key-points article { border-left:4px solid var(--accent); border-radius:0 9px 9px 0; background:#f1f7f6; padding:14px 16px; }
    .key-points h3,.thoughts h3 { margin:0; font-size:1.05rem; line-height:1.35; }
    .key-points p,.thoughts p { margin:.45rem 0 0; color:#45535b; }
    .block-food-for-thought { border-color:#e6c993; background:#fffaf0; }
    .thoughts { display:grid; gap:12px; margin-top:18px; }
    .thoughts article { display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; }
    .thoughts article > span { display:grid; place-items:center; width:32px; height:32px; border-radius:50%; color:#fff; background:var(--warm); font-family:ui-serif,Georgia,serif; font-size:1.1rem; font-weight:900; }
    footer { border-top:1px solid var(--line); padding:22px 0 34px; color:var(--muted); font-size:.9rem; }
    @media (max-width:700px) { .hero { grid-template-columns:1fr; padding-top:28px; } .report-block { padding:18px; } .process { display:grid; gap:28px; } .process li:not(:last-child)::after { content:"↓"; right:auto; top:auto; left:18px; bottom:-27px; transform:none; } }
    @media (max-width:375px) { .page { width:calc(100% - 20px); } .hero { gap:18px; } h1 { font-size:1.85rem; } .key-points { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="page hero">
    <div>
      <p class="eyebrow">影片閱讀摘要</p>
      <h1>{{title}}</h1>
      {{subtitleHtml}}
      <div class="meta"><span>{{channel}}</span><span>{{duration}}</span></div>
      <p><a href="{{sourceUrl}}" target="_blank" rel="noreferrer">開啟原始影片</a></p>
    </div>
    {{thumbnailHtml}}
  </header>
  <main class="page">
    {{blocksHtml}}
  </main>
  <footer class="page">{{footerNote}}</footer>
</body>
</html>
