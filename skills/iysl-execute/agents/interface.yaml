interface:
  display_name: "iysl-execute"
  short_description: "Execute approved changes with adaptive agents and fresh review."
  default_prompt: "Use $iysl-execute to complete this approved software change with proportional delegation, verification, and fresh review."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
