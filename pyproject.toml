# Repo-level pytest settings only. This project ships skills, not a package.
#
# Eight skills each own a `tests/test_contract.py`. Under pytest's default
# "prepend" import mode those basenames collide, so a run from the repo root
# aborts during collection even though every per-skill run is green. importlib
# mode imports each file under its full path and removes the collision.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
