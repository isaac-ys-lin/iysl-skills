interface:
  display_name: "Equity Data"
  short_description: "Two-stage evidence intake for public-equity analysis"
  default_prompt: "Pair $equity-data with the Public Equity Investing router; run bounded Ask SA recall, complete the core Seeking Alpha evidence-or-gap coverage gate, retrieve only decision-relevant extensions, defer Wall Street targets during embedded underwriting until the owner freezes independent fair value, verify load-bearing claims, and return the smallest evidence handoff."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "native-implicit-skill"
    generic: "description-routed"
